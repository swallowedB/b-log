name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:content

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:ci

      - run: pnpm build:next
      # Hosted Ubuntu includes Chromium's system libraries. Avoid an unrelated apt mirror dependency.
      # A missing runtime library still fails the real browser launch/tests below.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

      - name: Upload browser report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
